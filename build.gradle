plugins {
    id 'application'
    id 'java'
}

group = 'com.chicken'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'io.netty:netty-all:4.2.2.Final'
    implementation 'com.mysql:mysql-connector-j:9.3.0'
    implementation 'com.zaxxer:HikariCP:6.3.0'
    implementation 'com.alibaba.fastjson2:fastjson2:2.0.57'
}

application {
    mainClass = 'com.chicken.ChickenMayChu'
    applicationName = 'Chicken_lt'
}

run {
    workingDir = projectDir
    jvmArgs '-Dfile.encoding=UTF-8', '-Xms512M', '-Xmx1024M'
}

sourceSets {
    main {
        java {
            srcDirs 'src'
        }
    }
    combatTest {
        java {
            srcDirs 'combat-test'
        }
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    combatTestImplementation.extendsFrom implementation
    combatTestRuntimeOnly.extendsFrom runtimeOnly
}

tasks.register('combatTest', JavaExec) {
    group = 'verification'
    description = 'Chay bo kiem thu hoi quy chung toan game.'
    dependsOn tasks.named('combatTestClasses')
    classpath = sourceSets.combatTest.runtimeClasspath
    mainClass = 'com.chicken.kiemthu.ChickenKiemThuToanGame'
    jvmArgs '-Dfile.encoding=UTF-8'
}

tasks.named('check') {
    dependsOn tasks.named('combatTest')
}

jar {
    archiveBaseName = 'Chicken_lt'
    archiveVersion = ''
    manifest {
        attributes 'Main-Class': 'com.chicken.ChickenMayChu'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}
